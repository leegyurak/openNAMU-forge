[project]
name = "opennamu-forge"
version = "3.6.0b58"
description = "Modern, agent-friendly Python/Flask wiki engine based on openNAMU."
readme = "readme-en.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
dependencies = [
    "aiohttp",
    "alembic>=1.16,<2.0",
    "cryptography",
    "diff-match-patch",
    "flask[async]>=3.1.3,<4.0",
    "gunicorn",
    "h11",
    "nest-asyncio",
    "pillow",
    "prometheus-flask-exporter>=0.23.2,<1.0.0",
    "psutil",
    "psycopg[binary]",
    "pymysql",
    "requests",
    "sqlmodel>=0.0.38,<0.1.0",
]

[project.optional-dependencies]
performance = [
    "orjson",
    "regex",
]
mysql-native = [
    "mysqlclient",
]
dev = [
    "coverage[toml]>=7.0,<8.0",
    "pytest>=8.4,<9.0",
    "ruff>=0.14.8,<0.15.0",
    "ty>=0.0.1a23",
]

[tool.uv]
package = false

[tool.coverage.run]
source = [
    "opennamu_forge",
]
omit = [
    "opennamu_forge/presentation/routes/__init__.py",
    "opennamu_forge/presentation/routes/*.py",
    "opennamu_forge/presentation/rendering/renderer.py",
    "opennamu_forge/presentation/rendering/namumark.py",
    "opennamu_forge/presentation/shared/func.py",
    "opennamu_forge/presentation/runtime_app.py",
]

[tool.coverage.report]
fail_under = 90
show_missing = true

[tool.pytest.ini_options]
pythonpath = [
    ".",
]
testpaths = [
    "tests",
]

[tool.ruff]
target-version = "py310"
line-length = 120
extend-exclude = [
    "opennamu_forge/presentation/runtime_app.py",
    "opennamu_forge/presentation/routes/**/*.py",
    "opennamu_forge/presentation/rendering/renderer.py",
    "opennamu_forge/presentation/rendering/namumark.py",
    "opennamu_forge/presentation/shared/func.py",
]

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "UP",
]
ignore = [
    "E501",
]

[tool.ruff.lint.per-file-ignores]
"app.py" = ["F403", "F405", "E722"]
"opennamu_forge/presentation/routes/**/*.py" = ["F403", "F405", "E722"]
"opennamu_forge/presentation/shared/sql_dialect.py" = ["E722"]
"tests/**/*.py" = ["E501"]

[tool.ty.environment]
python-version = "3.10"
